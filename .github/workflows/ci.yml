name: CI

on:
  push:
    branches: [main]
    tags: ["audiothek-downloader-v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "apps/*/uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev --project apps/audiothek-downloader

      - name: Run Ruff Lint Check
        run: uv run --project apps/audiothek-downloader ruff check .

      - name: Run Ruff Format Check
        run: uv run --project apps/audiothek-downloader ruff format --check .

      - name: MyPy Type-checking
        run: uv run --project apps/audiothek-downloader mypy .

      - name: Pyright Type-checking
        run: uv run --project apps/audiothek-downloader pyright

      - name: Run Test Suite
        run: ./scripts/run_coverage.sh

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        app: [audiothek-downloader]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          tags: |
            # Main branch: continuously updated development image.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

            # Commit SHA.
            type=sha,prefix=

            # App versions use tags such as audiothek-downloader-v1.2.3.
            # Generate exact, minor and major version tags.
            type=semver,pattern={{version}},value=${{ github.ref_name }},match=${{ matrix.app }}-v(.*),enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},match=${{ matrix.app }}-v(.*),enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}},value=${{ github.ref_name }},match=${{ matrix.app }}-v(.*),enable=${{ startsWith(github.ref, 'refs/tags/') }}

          # Prevent automatic latest generation on version-tag pushes.
          flavor: |
            latest=false

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # Push images for main and version tag pushes, but not pull requests.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
