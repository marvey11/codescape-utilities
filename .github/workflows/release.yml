name: Create GitHub Release

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to main
        run: |
          git fetch origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit contained in main." >&2
            exit 1
          fi

      - name: Validate release tag
        id: tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG_NAME" =~ ^([A-Za-z0-9._-]+)-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag '$TAG_NAME' does not match <application>-v<major>.<minor>.<patch>" >&2
            exit 1
          fi

          app="${BASH_REMATCH[1]}"
          major="${BASH_REMATCH[2]}"
          minor="${BASH_REMATCH[3]}"
          patch="${BASH_REMATCH[4]}"
          version="${major}.${minor}.${patch}"
          if [[ ! -f "apps/$app/pyproject.toml" || ! -f "apps/$app/Dockerfile" ]]; then
            echo "Application '$app' must have a pyproject.toml and Dockerfile." >&2
            exit 1
          fi

          {
            echo "app=${app}"
            echo "version=${version}"
            echo "major_minor=${major}.${minor}"
            echo "major=${major}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ steps.tag.outputs.app }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.version }}
            type=raw,value=${{ steps.tag.outputs.major_minor }}
            type=raw,value=${{ steps.tag.outputs.major }}
          flavor: |
            latest=false

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ steps.tag.outputs.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.tag.outputs.app }}
          cache-to: type=gha,scope=${{ steps.tag.outputs.app }},mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
