[project]
name = "audiothek-downloader"
version = "1.1.0"
description = "Download podcasts from ARD Audiothek"
readme = "README.md"
authors = [
    { name = "Marco Wegner", email = "673439+marvey11@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "core",
    "jsonpath-ng>=1.8.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.16.4",
    "types-requests>=2.33.0.20260906",
]

[tool.uv.sources]
core = { path = "../../libs/core", editable = true }

[project.scripts]
audiothek-downloader = "audiothek_downloader.main:app"
