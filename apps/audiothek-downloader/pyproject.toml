[project]
name = "audiothek-downloader"
version = "0.1.0"
description = "Download podcasts from ARD Audiothek"
readme = "README.md"
authors = [
    { name = "Marco Wegner", email = "673439+marvey11@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "achterhus-telemetry-client",
    "jsonpath-ng>=1.8.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["types-requests>=2.33.0.20260906"]

[tool.uv.sources]
achterhus-telemetry-client = { git = "https://github.com/marvey11/achterhus-telemetry-client.git", tag = "v0.1.0" }

[project.scripts]
audiothek-downloader = "audiothek_downloader.main:app"
