repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
        exclude: ^\.vscode/
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        # Optional: create a .markdownlint.json
        args: ["--fix", "--disable", "MD013"] # MD013 disables line length limits

  - repo: local
    hooks:
      - id: uv-locks
        name: uv locks
        entry: ./scripts/check_locks.sh
        language: system
        pass_filenames: false

      - id: ruff
        name: Ruff lint
        entry: uv run --project apps/audiothek-downloader ruff check .
        language: system
        pass_filenames: false

      - id: ruff-format
        name: Ruff format check
        entry: uv run --project apps/audiothek-downloader ruff format --check .
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run --project apps/audiothek-downloader mypy .
        language: system
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: uv run --project apps/audiothek-downloader pyright
        language: system
        pass_filenames: false

      # Run test suite across workspace before push
      - id: pytest
        name: pytest
        entry: ./scripts/run_coverage.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
