repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
        exclude: ^\.vscode/
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        # Optional: create a .markdownlint.json
        args: ["--fix", "--disable", "MD013"] # MD013 disables line length limits

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --all-packages mypy .
        language: system
        pass_filenames: false

      # Run test suite across workspace before push
      - id: pytest
        name: pytest
        entry: uv run --all-packages pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
